<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Campus Event & Activities Hub: discover events, clubs and venues at Mulungushi University. ICT461 Group 2 concept demo.">
  <title>Campus Event &amp; Activities Hub | Mulungushi University</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="demo-banner">Concept demo: data is stored in your browser and payments are simulated. <button type="button" id="reset-demo">Reset demo data</button></div>

  <header class="site-header">
    <div class="inner">
      <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">C</span>Campus Events Hub</a>
      <nav aria-label="Primary">
        <ul id="nav"></ul>
      </nav>
      <div class="role-switch">
        <label for="role" class="m0">View as</label>
        <select id="role">
          <option value="student">Student</option>
          <option value="organizer">Organizer</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="site-footer">
    <p>&copy; 2026 Mulungushi University · ICT461 Group 2 · Campus Event &amp; Activities Hub (concept demo)</p>
  </footer>
  <div class="toast-region" role="status" aria-live="polite" id="toasts"></div>
  <div id="modal-root"></div>
</body>
</html>
