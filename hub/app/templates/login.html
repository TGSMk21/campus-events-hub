{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block page %}login{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block scripts %}<script nonce="{{ nonce }}" src="{{ static('js/forms.js') }}" defer></script>{% endblock %}

{% block content %}
<h1>Sign in</h1>
<p class="muted">Use the email address you registered with. New here? <a href="/register?next={{ next|urlencode }}">Create an account</a>.</p>

<div id="status" class="summary" role="status" aria-live="polite" tabindex="-1"></div>

<form id="login-form" class="panel" novalidate data-next="{{ next }}">
  <div class="field">
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" autocomplete="username" required maxlength="254" aria-describedby="email-error">
    <p id="email-error" class="error" hidden></p>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required maxlength="128" aria-describedby="password-error">
    <p id="password-error" class="error" hidden></p>
  </div>
  <div class="actions"><button class="btn btn-primary" type="submit">Sign in</button></div>
</form>
{% endblock %}
